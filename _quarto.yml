project:
  type: website
  output-dir: docs

website:
  title: "Bryan Trannin Bayne"
  description: "PhD student in Political Science at American University working on climate and energy politics, political economy, and applied data science."
  # ── Update after you create the GitHub repo ─────────────────────────────
  site-url: https://bryanbayne.com
  repo-url: https://github.com/bryanbayne/bryanbayne.github.io
  # ────────────────────────────────────────────────────────────────────────
  favicon: images/favicon.svg

  # Social metadata (Open Graph + Twitter Cards)
  open-graph: true
  twitter-card:
    card-style: summary
    # creator: "@your-handle"
  image: images/headshot.svg   # ← swap to images/headshot.jpg when you add your photo

  # ── Google Analytics (GA4) — uncomment and add your ID ─────────────────
  # google-analytics:
  #   tracking-id: "G-XXXXXXXXXX"
  #   anonymize-ip: true
  # ────────────────────────────────────────────────────────────────────────

  navbar:
    title: "Bryan T. Bayne"
    pinned: true
    left:
      - text: "Home"
        href: index.qmd
      - text: "Research"
        href: research.qmd
      - text: "CV"
        href: cv.qmd
    right:
      - icon: github
        href: https://github.com/bryanbayne
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/bryan-bayne
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:bryantrannin@gmail.com
        aria-label: Email

  page-footer:
    center: |
      © 2026 Bryan Trannin Bayne · Built with [Quarto](https://quarto.org)

format:
  html:
    theme:
      - cosmo
      - custom.scss
    toc: false
    anchor-sections: false
    link-external-newwindow: true
    smooth-scroll: true
    page-layout: article
